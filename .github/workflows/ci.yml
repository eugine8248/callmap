name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-build:
    name: Typecheck + build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build all workspaces (engine + ui + desktop webview + vscode)
        run: npm run build

      - name: Package the VS Code extension (verification only — no upload)
        run: npm --workspace callmap-vscode run package

  site:
    name: Build docs site
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build site
        run: npm --workspace @callmap/site run build
        env:
          CALLMAP_SITE_BASE: "/callmap/"
