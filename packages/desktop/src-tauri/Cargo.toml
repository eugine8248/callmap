[package]
name = "callmap"
version = "1.0.0"
description = "PR-delta callgraph viewer for code reviewers"
authors = ["callmap contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "callmap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v0.5 — OS-keychain backed PAT storage. The `keyring` crate is the
# smallest path: ~80KB compiled, talks to Windows Credential Manager,
# macOS Keychain Services, and Linux secret-service. No background
# daemon, no extra DLLs to ship.
keyring = { version = "3", default-features = false, features = [
  "windows-native",
  "apple-native",
  "sync-secret-service",
  "vendored",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
